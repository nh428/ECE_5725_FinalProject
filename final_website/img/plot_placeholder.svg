<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
<title id="title">Overlay Plot Placeholder</title><desc id="desc">Placeholder graph showing a planned path and person tracking path.</desc>
<style>.axis{stroke:#334155;stroke-width:3}.grid{stroke:#cbd5e1;stroke-width:1}.path{fill:none;stroke:#2563eb;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}.person{fill:none;stroke:#f97316;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:12 8}.bad{fill:#ef4444}.text{font-family:Arial,sans-serif;font-size:22px;fill:#0f172a}.small{font-family:Arial,sans-serif;font-size:18px;fill:#334155}</style>
<rect width="900" height="520" fill="#f8fafc"/><g transform="translate(80,40)">
<line x1="0" y1="400" x2="740" y2="400" class="axis"/><line x1="0" y1="400" x2="0" y2="0" class="axis"/>
<g class="grid"><line x1="0" y1="320" x2="740" y2="320"/><line x1="0" y1="240" x2="740" y2="240"/><line x1="0" y1="160" x2="740" y2="160"/><line x1="0" y1="80" x2="740" y2="80"/><line x1="160" y1="0" x2="160" y2="400"/><line x1="320" y1="0" x2="320" y2="400"/><line x1="480" y1="0" x2="480" y2="400"/><line x1="640" y1="0" x2="640" y2="400"/></g>
<polyline points="40,360 180,360 180,250 370,250 370,120 650,120" class="path"/>
<polyline points="40,360 165,355 195,262 350,250 405,150 620,135" class="person"/>
<circle cx="405" cy="150" r="13" class="bad"/><text x="430" y="157" class="small">Deviation threshold exceeded</text>
<text x="0" y="-10" class="text">Planned path vs. live person tracking</text><text x="500" y="455" class="small">X position</text><text x="-65" y="200" class="small" transform="rotate(-90 -65 200)">Y position</text>
<rect x="500" y="300" width="210" height="78" fill="#fff" stroke="#cbd5e1"/><line x1="520" y1="323" x2="580" y2="323" class="path"/><text x="595" y="330" class="small">Planned path</text><line x1="520" y1="355" x2="580" y2="355" class="person"/><text x="595" y="362" class="small">Person PDR</text>
</g></svg>
