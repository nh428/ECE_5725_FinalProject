<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540" role="img" aria-labelledby="title desc">
<title id="title">System Architecture Diagram</title>
<desc id="desc">A block diagram showing the robot, Pi 4, Pi Zero wearable, BNO055 IMU, LiDAR, SLAM, planned path CSV, Wi-Fi communication, and buzzer feedback.</desc>
<style>
  .box{fill:#ffffff;stroke:#1f4e79;stroke-width:3;rx:18;ry:18}.box2{fill:#eef7ff;stroke:#1f4e79;stroke-width:3;rx:18;ry:18}.box3{fill:#fff7e6;stroke:#9a6700;stroke-width:3;rx:18;ry:18}.label{font-family:Arial, sans-serif;font-size:24px;font-weight:700;fill:#0b1f33}.text{font-family:Arial, sans-serif;font-size:18px;fill:#0b1f33}.arrow{stroke:#334155;stroke-width:4;marker-end:url(#arrow)}.dash{stroke:#64748b;stroke-width:4;stroke-dasharray:10 8;marker-end:url(#arrow)}
</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs>
<rect x="40" y="70" width="300" height="170" class="box2"/><text x="70" y="115" class="label">Robot Platform</text><text x="70" y="155" class="text">Manual/RC driving</text><text x="70" y="185" class="text">Robot-mounted buzzer</text><text x="70" y="215" class="text">Raspberry Pi 4</text>
<rect x="420" y="40" width="300" height="130" class="box"/><text x="450" y="85" class="label">LiDAR + ROS 2</text><text x="450" y="125" class="text">/scan, RViz2, SLAM Toolbox</text><text x="450" y="150" class="text">Room map and planned path</text>
<rect x="420" y="230" width="300" height="120" class="box"/><text x="450" y="275" class="label">Path Overlay Script</text><text x="450" y="315" class="text">planned_path.csv + live PDR</text><text x="450" y="340" class="text">Deviation check and plot export</text>
<rect x="790" y="70" width="270" height="170" class="box3"/><text x="820" y="115" class="label">Wearable Unit</text><text x="820" y="155" class="text">Pi Zero 2 W</text><text x="820" y="185" class="text">BNO055 IMU</text><text x="820" y="215" class="text">PDR step tracking</text>
<rect x="790" y="315" width="270" height="120" class="box"/><text x="820" y="360" class="label">Final Output</text><text x="820" y="400" class="text">Coordinate plot image</text><text x="820" y="425" class="text">Buzzer if user deviates</text>
<line x1="340" y1="145" x2="420" y2="105" class="arrow"/><line x1="570" y1="170" x2="570" y2="230" class="arrow"/><line x1="790" y1="155" x2="720" y2="285" class="dash"/><line x1="720" y1="295" x2="790" y2="375" class="arrow"/><line x1="340" y1="175" x2="420" y2="290" class="arrow"/>
<text x="525" y="205" class="text">CSV export</text><text x="718" y="255" class="text">Wi-Fi JSON</text><text x="90" y="305" class="text">The robot maps and provides the audible guide.</text><text x="90" y="335" class="text">The wearable estimates whether the person follows the planned route.</text>
</svg>
